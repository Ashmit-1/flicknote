services:
  backend:
    image: ashmitdas/flicknote-backend:arm
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      # Absolute path inside the container; the named volume below is mounted at /data.
      DATABASE_URL: sqlite:////data/quicknotes.db
      # Comma-separated frontend origin(s). If a .env file with CORS_ORIGINS is
      # present next to this file, Compose uses it.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - quicknotes_data:/data

volumes:
  quicknotes_data:
